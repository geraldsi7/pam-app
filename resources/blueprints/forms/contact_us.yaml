tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: first_name
            field:
              placeholder: 'Enter your first name'
              type: text
              display: 'First Name'
              validate:
                - required
                - 'max:100'
                - 'regex:/^[\pL\s\-\''\.]+$/u'
              width: 50
          -
            handle: last_name
            field:
              placeholder: 'Enter your last name'
              type: text
              display: 'Last Name'
              validate:
                - required
                - 'max:100'
                - 'regex:/^[\pL\s\-\''\.]+$/u'
              width: 50
          -
            handle: email
            field:
              placeholder: 'Enter your email address'
              type: text
              display: 'Email Address'
              validate:
                - required
                - email
              input_type: email
          -
            handle: phone_number
            field:
              placeholder: 'Enter your phone number'
              type: text
              display: 'Phone Number'
              validate:
                - 'regex:/^\+?[0-9\s\-]{7,15}$/'
              input_type: tel
          -
            handle: message_content
            field:
              placeholder: 'Let us know how we can help!'
              type: textarea
              display: Message
              validate:
                - required
