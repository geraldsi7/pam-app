tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: company_name
            field:
              placeholder: 'Enter your company name'
              type: text
              display: 'Company Name'
              validate:
                - required
                - 'max:100'
              width: 50
          -
            handle: contact_person
            field:
              placeholder: 'Enter contact person name'
              type: text
              display: 'Contact Person'
              validate:
                - required
                - 'max:100'
              width: 50
          -
            handle: email
            field:
              placeholder: 'Enter your email address'
              type: text
              display: 'Email Address'
              validate:
                - required
                - email
              input_type: email
              width: 50
          -
            handle: phone
            field:
              placeholder: 'Enter your phone number'
              type: text
              display: 'Phone Number'
              validate:
                - required
                - 'regex:/^\+?[0-9\s\-\(\)]{7,20}$/'
              input_type: tel
              width: 50
          -
            handle: service_type
            field:
              type: select
              display: 'Service of Interest'
              options:
                minerals_mining: 'Minerals & Mining'
                commodity_trading: 'Commodity Trading'
                construction: 'Construction & Development'
                renewable_energy: 'Renewable Energy'
                procurement: 'International Procurement'
                other: 'Other (please specify)'
              placeholder: 'Select service type'
              clearable: true
              searchable: true
              validate:
                - required
          -
            handle: project_location
            field:
              placeholder: 'Enter project location or region'
              type: text
              display: 'Project Location/Region'
              validate:
                - 'max:100'
          -
            handle: project_timeline
            field:
              type: select
              display: 'Project Timeline'
              options:
                immediate: 'Immediate (ASAP)'
                '1-3_months': '1-3 Months'
                '3-6_months': '3-6 Months'
                '6-12_months': '6-12 Months'
                planning: 'Still in Planning Phase'
                flexible: 'Flexible Timeline'
              placeholder: 'Select timeline'
              clearable: true
              searchable: true
          -
            handle: budget_range
            field:
              type: select
              display: 'Estimated Budget Range'
              options:
                under_100k: 'Under $100,000'
                '100k-500k': '$100,000 - $500,000'
                '500k-1m': '$500,000 - $1,000,000'
                '1m-5m': '$1,000,000 - $5,000,000'
                over_5m: 'Over $5,000,000'
                confidential: 'Prefer not to disclose'
              placeholder: 'Select budget range'
              clearable: true
              searchable: true
          -
            handle: project_description
            field:
              placeholder: 'Please provide details about your project requirements, scope, and any specific needs.'
              type: textarea
              display: 'Project Description'
              validate:
                - required
                - 'min:50'
                - 'max:2000'
              instructions: 'Provide as much detail as possible about your project needs.'
          -
            handle: additional_requirements
            field:
              placeholder: 'Any additional requirements, special considerations, or questions?'
              type: textarea
              display: 'Additional Requirements/Questions'
              validate:
                - 'max:1000'
          -
            handle: preferred_contact_method
            field:
              type: select
              display: 'Preferred Contact Method'
              options:
                email: Email
                phone: Phone
                either: Either Email or Phone
              placeholder: 'Select preferred contact method'
              clearable: true
              searchable: true
              default: email
          -
            handle: urgency_level
            field:
              type: select
              display: 'Urgency Level'
              options:
                low: 'Low - General inquiry'
                medium: 'Medium - Planning to move forward soon'
                high: 'High - Ready to proceed immediately'
              placeholder: 'Select urgency level'
              clearable: true
              searchable: true
              default: medium
  privacy:
    display: Privacy
    sections:
      -
        fields:
          -
            handle: privacy_consent
            field:
              type: checkbox
              display: 'Privacy Consent'
              options:
                consent: 'I consent to PAM collecting and processing my personal data for the purpose of responding to this quote request. I understand that my information will be handled in accordance with PAM''s privacy policy.'
              validate:
                - required
              instructions: 'Your privacy is important to us. Please review our privacy policy for details on how we handle your data.'