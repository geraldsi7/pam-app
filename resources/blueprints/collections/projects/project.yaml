title: Project
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'Brief description for listings and meta tags'
              validate: 'max:160'
          -
            handle: content
            field:
              type: bard
              display: Content
              instructions: 'Detailed project information and case study'
              container: assets
              save_html: false
              toolbar_mode: floating
              link_noopener: false
              link_noreferrer: false
              target_blank: false
              reading_time: false
              word_count: false
              fullscreen: true
              allow_source: true
              always_show_set_button: false
              sets:
                project_details:
                  display: 'Project Details'
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                        instructions: 'e.g., Project Overview, Scope & Scale'
                    -
                      handle: items
                      field:
                        type: grid
                        display: Items
                        fields:
                          -
                            handle: label
                            field:
                              type: text
                              display: Label
                          -
                            handle: value
                            field:
                              type: text
                              display: Value
                technical_specs:
                  display: 'Technical Specifications'
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: specifications
                      field:
                        type: grid
                        display: Specifications
                        fields:
                          -
                            handle: spec
                            field:
                              type: text
                              display: Specification
                          -
                            handle: detail
                            field:
                              type: text
                              display: Detail
                results:
                  display: Results
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: metrics
                      field:
                        type: grid
                        display: Metrics
                        fields:
                          -
                            handle: metric
                            field:
                              type: text
                              display: Metric
                          -
                            handle: value
                            field:
                              type: text
                              display: Value
                          -
                            handle: timeframe
                            field:
                              type: text
                              display: Timeframe
          -
            handle: featured_image
            field:
              container: assets
              type: assets
              display: 'Featured Image'
              max_files: 1
              mode: grid
              validate:
                - required
          -
            handle: gallery
            field:
              container: assets
              type: assets
              display: Gallery
              mode: grid
          -
            handle: project_type
            field:
              type: select
              display: 'Project Type'
              options:
                mining: 'Mining Operation'
                solar: 'Solar Farm'
                construction: 'Construction Project'
                procurement: 'Procurement Initiative'
                development: 'Real Estate Development'
                trading: 'Commodity Trading'
              clearable: true
              searchable: true
          -
            handle: status
            field:
              type: select
              display: Status
              options:
                completed: Completed
                ongoing: Ongoing
                planned: Planned
              clearable: true
              searchable: true
          -
            handle: location
            field:
              type: text
              display: Location
              instructions: 'Country, region, or specific location'
          -
            handle: client
            field:
              type: text
              display: Client
              instructions: 'Client name or "Confidential"'
          -
            handle: completion_date
            field:
              type: date
              display: 'Completion Date'
              time_enabled: false
              time_required: false
              earliest_date: '2000-01-01'
              full_width: false
              inline: false
              columns: 1
              mode: single
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: meta_title
            field:
              type: text
              display: 'Meta Title'
              instructions: 'Recommended: 50-60 characters'
              validate: 'max:60'
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Meta Description'
              instructions: 'Recommended: 150-160 characters'
              validate: 'max:160'
          -
            handle: og_image
            field:
              container: assets
              type: assets
              display: 'Open Graph Image'
              instructions: 'Recommended: 1200x630px'
              max_files: 1
              mode: grid
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'