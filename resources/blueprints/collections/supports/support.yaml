title: Support
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: textarea
              display: Description
          -
            handle: icon
            field:
              type: text
              display: Icon
          -
            handle: featured_grid
            field:
              type: grid
              display: 'Featured Grid'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: parent
            field:
              type: entries
              collections:
                - quick_help
              max_items: 1
              listable: false
              localizable: true
