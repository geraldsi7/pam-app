title: Partner
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              instructions: 'The title for the partners section'
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'Brief description for listings and meta tags'
              validate: 'max:160'
          -
            handle: content
            field:
              type: bard
              display: Content
              instructions: 'Detailed partnership information'
              container: assets
              toolbar_mode: floating
              allow_source: true
          -
            handle: partners
            field:
              type: grid
              display: Partners
              instructions: 'List of partner companies'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: 'Company Name'
                    instructions: 'The company name'
                    validate:
                      - required
                -
                  handle: partnership_type
                  field:
                    type: select
                    display: 'Partnership Type'
                    options:
                      strategic: Strategic
                      supplier: Supplier
                      client: Client
                      certification: Certification
                      association: 'Industry Association'
                    clearable: true
                -
                  handle: featured
                  field:
                    type: toggle
                    display: Featured
                    instructions: 'Highlight this partner prominently'
                -
                  handle: featured_image
                  field:
                    container: assets
                    max_files: 1
                    min_files: 1
                    type: assets
                    display: 'Featured Image'
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: meta_title
            field:
              type: text
              display: 'Meta Title'
              instructions: 'Recommended: 50-60 characters'
              validate: 'max:60'
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Meta Description'
              instructions: 'Recommended: 150-160 characters'
              validate: 'max:160'
          -
            handle: og_image
            field:
              container: assets
              type: assets
              display: 'Open Graph Image'
              instructions: 'Recommended: 1200x630px'
              max_files: 1
              mode: grid
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
