title: Product
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'Brief description for listings and meta tags'
              validate: 'max:160'
          -
            handle: content
            field:
              type: bard
              display: Content
              instructions: 'Detailed product information'
              container: assets
              save_html: false
              toolbar_mode: floating
              link_noopener: false
              link_noreferrer: false
              target_blank: false
              reading_time: false
              word_count: false
              fullscreen: true
              allow_source: true
              always_show_set_button: false
              sets:
                specifications:
                  display: Specifications
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                        instructions: 'e.g., Product Specifications, Technical Details'
                    -
                      handle: items
                      field:
                        type: grid
                        display: Items
                        fields:
                          -
                            handle: label
                            field:
                              type: text
                              display: Label
                          -
                            handle: value
                            field:
                              type: text
                              display: Value
                applications:
                  display: Applications
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: items
                      field:
                        type: list
                        display: Applications
                        add_button: 'Add Application'
                pricing:
                  display: Pricing
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                        instructions: 'e.g., Pricing Information, Quote Request'
                    -
                      handle: content
                      field:
                        type: textarea
                        display: Content
                        instructions: 'Pricing details or quote request information'
          -
            handle: featured_image
            field:
              container: assets
              type: assets
              display: 'Featured Image'
              max_files: 1
              mode: grid
              validate:
                - required
          -
            handle: gallery
            field:
              container: assets
              type: assets
              display: Gallery
              mode: grid
          -
            handle: product_type
            field:
              type: select
              display: 'Product Type'
              options:
                mineral: Mineral
                commodity: Commodity
                equipment: Equipment
                service: Service
              clearable: true
              searchable: true
          -
            handle: category
            field:
              type: select
              display: Category
              options:
                mining: Mining
                agriculture: Agriculture
                energy: Energy
                industrial: Industrial
                construction: Construction
              clearable: true
              searchable: true
          -
            handle: availability
            field:
              type: select
              display: Availability
              options:
                available: Available
                limited: Limited Stock
                discontinued: Discontinued
                quote: Quote Required
              clearable: true
              searchable: true
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: meta_title
            field:
              type: text
              display: 'Meta Title'
              instructions: 'Recommended: 50-60 characters'
              validate: 'max:60'
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Meta Description'
              instructions: 'Recommended: 150-160 characters'
              validate: 'max:160'
          -
            handle: og_image
            field:
              container: assets
              type: assets
              display: 'Open Graph Image'
              instructions: 'Recommended: 1200x630px'
              max_files: 1
              mode: grid
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
