title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'Brief description for listings and meta tags'
              validate: 'max:160'
          -
            handle: content
            field:
              type: bard
              display: Content
              instructions: 'Page content with rich formatting'
              container: assets
              save_html: false
              toolbar_mode: floating
              link_noopener: false
              link_noreferrer: false
              target_blank: false
              reading_time: false
              word_count: false
              fullscreen: true
              allow_source: true
              always_show_set_button: false
              sets:
                hero:
                  display: Hero
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: subtitle
                      field:
                        type: textarea
                        display: Subtitle
                    -
                      handle: background_image
                      field:
                        container: assets
                        type: assets
                        display: 'Background Image'
                        max_files: 1
                        mode: grid
                    -
                      handle: cta_text
                      field:
                        type: text
                        display: 'CTA Text'
                    -
                      handle: cta_link
                      field:
                        type: link
                        display: 'CTA Link'
                section:
                  display: Section
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: content
                      field:
                        type: bard
                        display: Content
                        container: assets
                        save_html: false
                        toolbar_mode: floating
                    -
                      handle: layout
                      field:
                        type: select
                        display: Layout
                        options:
                          full: Full Width
                          grid: Grid
                          columns: Columns
                        default: full
                contact_form:
                  display: 'Contact Form'
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: description
                      field:
                        type: textarea
                        display: Description
          -
            handle: author
            field:
              type: users
              display: Author
              default: current
              localizable: true
              max_items: 1
          -
            handle: template
            field:
              type: template
              display: Template
              localizable: true
          -
            handle: page_type
            field:
              type: select
              display: 'Page Type'
              options:
                standard: Standard
                landing: Landing Page
                service: Service Page
                about: About Page
                contact: Contact Page
              clearable: true
              searchable: true
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: meta_title
            field:
              type: text
              display: 'Meta Title'
              instructions: 'Recommended: 50-60 characters'
              validate: 'max:60'
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Meta Description'
              instructions: 'Recommended: 150-160 characters'
              validate: 'max:160'
          -
            handle: og_image
            field:
              container: assets
              type: assets
              display: 'Open Graph Image'
              instructions: 'Recommended: 1200x630px'
              max_files: 1
              mode: grid
          -
            handle: keywords
            field:
              type: text
              display: Keywords
              instructions: 'Comma-separated keywords for SEO'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
