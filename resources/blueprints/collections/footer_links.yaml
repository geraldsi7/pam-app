title: Footer Links
tabs:
  main:
    display: Main
    fields:
      -
        handle: title
        field:
          type: text
          display: Title
          validate:
            - required
      -
        handle: links
        field:
          type: replicator
          display: Links
          sets:
            link:
              display: Link
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: Link Text
                    validate:
                      - required
                -
                  handle: url
                  field:
                    type: text
                    display: URL
                    validate:
                      - required
