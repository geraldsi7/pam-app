title: Team Member
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              required: true
              validate:
                - required
              display: Name
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: 'Job Title'
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'Brief bio for listings'
              validate: 'max:160'
          -
            handle: bio
            field:
              type: bard
              display: Bio
              instructions: 'Detailed biography and experience'
              container: assets
              save_html: false
              toolbar_mode: floating
              link_noopener: false
              link_noreferrer: false
              target_blank: false
              reading_time: false
              word_count: false
              fullscreen: true
              allow_source: true
              always_show_set_button: false
              sets:
                experience:
                  display: Experience
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                        instructions: 'e.g., Professional Experience, Key Achievements'
                    -
                      handle: items
                      field:
                        type: list
                        display: Items
                        add_button: 'Add Item'
                education:
                  display: Education
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: items
                      field:
                        type: list
                        display: Items
                        add_button: 'Add Item'
                certifications:
                  display: Certifications
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: items
                      field:
                        type: list
                        display: Items
                        add_button: 'Add Item'
          -
            handle: photo
            field:
              container: assets
              type: assets
              display: Photo
              max_files: 1
              mode: grid
              validate:
                - required
          -
            handle: department
            field:
              type: select
              display: Department
              options:
                executive: Executive
                operations: Operations
                mining: Mining
                commodities: Commodities
                construction: Construction
                renewable: Renewable Energy
                procurement: Procurement
                finance: Finance
                legal: Legal
              clearable: true
              searchable: true
          -
            handle: level
            field:
              type: select
              display: Level
              options:
                ceo: CEO
                director: Director
                manager: Manager
                specialist: Specialist
                coordinator: Coordinator
              clearable: true
              searchable: true
          -
            handle: email
            field:
              type: text
              display: Email
              input_type: email
          -
            handle: phone
            field:
              type: text
              display: Phone
          -
            handle: linkedin
            field:
              type: text
              display: 'LinkedIn Profile'
              input_type: url
          -
            handle: order
            field:
              type: integer
              display: 'Display Order'
              instructions: 'Lower numbers appear first'
              default: 999
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: meta_title
            field:
              type: text
              display: 'Meta Title'
              instructions: 'Recommended: 50-60 characters'
              validate: 'max:60'
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Meta Description'
              instructions: 'Recommended: 150-160 characters'
              validate: 'max:160'
          -
            handle: og_image
            field:
              container: assets
              type: assets
              display: 'Open Graph Image'
              instructions: 'Recommended: 1200x630px'
              max_files: 1
              mode: grid
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'