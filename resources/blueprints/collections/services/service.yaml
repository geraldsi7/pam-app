title: Service
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'Brief description for listings and meta tags'
              validate: 'max:255'
          -
            handle: content
            field:
              type: bard
              display: Content
              instructions: 'Rich content for the service detail page'
              container: assets
              save_html: false
              toolbar_mode: floating
              link_noopener: false
              link_noreferrer: false
              target_blank: false
              reading_time: false
              word_count: false
              fullscreen: true
              allow_source: true
              always_show_set_button: false
              sets:
                specifications:
                  display: Specifications
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                        instructions: 'e.g., Technical Specifications, Scope of Work'
                    -
                      handle: items
                      field:
                        type: grid
                        display: Items
                        fields:
                          -
                            handle: label
                            field:
                              type: text
                              display: Label
                          -
                            handle: value
                            field:
                              type: text
                              display: Value
                features:
                  display: Features
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: items
                      field:
                        type: grid
                        display: Items
                        fields:
                          -
                            handle: feature
                            field:
                              type: text
                              display: Feature
                          -
                            handle: description
                            field:
                              type: text
                              display: Description
                case_studies:
                  display: Case Studies
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: studies
                      field:
                        type: grid
                        display: Studies
                        fields:
                          -
                            handle: title
                            field:
                              type: text
                              display: Title
                          -
                            handle: description
                            field:
                              type: textarea
                              display: Description
                          -
                            handle: link
                            field:
                              type: link
                              display: Link
          -
            handle: featured_image
            field:
              container: assets
              type: assets
              display: 'Featured Image'
              max_files: 1
              mode: grid
              validate:
                - required
          -
            handle: gallery
            field:
              container: assets
              type: assets
              display: Gallery
              mode: grid
          -
            handle: service_type
            field:
              type: select
              display: 'Service Type'
              options:
                mining: 'Minerals & Mining'
                commodities: 'Commodity Trading'
                construction: 'Construction & Development'
                renewable: 'Renewable Energy'
                procurement: 'International Procurement'
              clearable: true
              searchable: true
          -
            handle: industry_focus
            field:
              type: select
              display: 'Industry Focus'
              options:
                mining: Mining
                agriculture: Agriculture
                energy: Energy
                construction: Construction
                manufacturing: Manufacturing
                government: Government
              multiple: true
              clearable: true
              searchable: true
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: meta_title
            field:
              type: text
              display: 'Meta Title'
              instructions: 'Recommended: 50-60 characters'
              validate: 'max:60'
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Meta Description'
              instructions: 'Recommended: 150-160 characters'
              validate: 'max:160'
          -
            handle: og_image
            field:
              container: assets
              type: assets
              display: 'Open Graph Image'
              instructions: 'Recommended: 1200x630px'
              max_files: 1
              mode: grid
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
              show_regenerate: true
