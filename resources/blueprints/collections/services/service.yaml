title: Service
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'Brief description for listings and meta tags'
              validate: 'max:255'
          -
            handle: content
            field:
              type: markdown
              display: Content
              instructions: 'Rich content for the service detail page'
              container: assets
              toolbar_mode: floating
              allow_source: true
              sets:
                specifications:
                  display: Specifications
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                        instructions: 'e.g., Technical Specifications, Scope of Work'
                    -
                      handle: items
                      field:
                        type: grid
                        display: Items
                        fields:
                          -
                            handle: label
                            field:
                              type: text
                              display: Label
                          -
                            handle: value
                            field:
                              type: text
                              display: Value
                features:
                  display: Features
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: items
                      field:
                        type: grid
                        display: Items
                        fields:
                          -
                            handle: feature
                            field:
                              type: text
                              display: Feature
                          -
                            handle: description
                            field:
                              type: text
                              display: Description
                case_studies:
                  display: 'Case Studies'
                  fields:
                    -
                      handle: title
                      field:
                        type: text
                        display: Title
                    -
                      handle: studies
                      field:
                        type: grid
                        display: Studies
                        fields:
                          -
                            handle: title
                            field:
                              type: text
                              display: Title
                          -
                            handle: description
                            field:
                              type: textarea
                              display: Description
                          -
                            handle: link
                            field:
                              type: link
                              display: Link
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: meta_title
            field:
              type: text
              display: 'Meta Title'
              instructions: 'Recommended: 50-60 characters'
              validate: 'max:60'
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Meta Description'
              instructions: 'Recommended: 150-160 characters'
              validate: 'max:160'
          -
            handle: og_image
            field:
              container: assets
              type: assets
              display: 'Open Graph Image'
              instructions: 'Recommended: 1200x630px'
              max_files: 1
              mode: grid
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
              show_regenerate: true
