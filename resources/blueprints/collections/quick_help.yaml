title: Quick Help
sections:
  main:
    display: Main
    fields:
      -
        handle: title
        field:
          type: text
          display: Service Title
          required: true
          validate:
            - required
      -
        handle: description
        field:
          type: textarea
          display: Service Description
          required: true
          character_limit: 300
      -
        handle: icon
        field:
          type: text
          display: FontAwesome Icon
          instructions: FontAwesome icon name (e.g., cogs, server, network-wired, chart-line)
          default: cogs
      -
        handle: icon_color
        field:
          type: select
          display: Icon Color
          options:
            blue: Blue
            green: Green
            red: Red
            orange: Orange
            purple: Purple
          default: blue
      -
        handle: color
        field:
          type: select
          display: Feature Tags Color
          options:
            blue: Blue
            green: Green
            red: Red
            orange: Orange
            purple: Purple
          default: blue
      -
        handle: features
        field:
          type: grid
          display: Features
          instructions: List of features for this service
          fields:
            -
              handle: title
              field:
                type: text
                display: Feature Title
                required: true
      -
        handle: order
        field:
          type: integer
          display: Display Order
          instructions: Order in which this service appears (lower numbers first)
          default: 1
