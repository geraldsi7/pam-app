title: Partners
fields:
  -
    handle: title
    field:
      type: text
      display: Title
      instructions: The title for the partners section
  -
    handle: heading
    field:
      type: text
      display: Heading
      instructions: The main heading text
  -
    handle: partners
    field:
      type: grid
      display: Partners
      instructions: List of partner companies
      fields:
        -
          handle: logo
          field:
            type: text
            display: Logo/Company Name
            instructions: The company logo text or name
        -
          handle: description
          field:
            type: textarea
            display: Description
            instructions: A brief description or quote about the partnership
        -
          handle: country
          field:
            type: text
            display: Country
            instructions: The country name
        -
          handle: flag
          field:
            type: text
            display: Flag Emoji
            instructions: Country flag emoji (e.g., 🇨🇦, 🇮🇳, 🇬🇭)
        -
          handle: website
          field:
            type: text
            display: Website URL
            instructions: The partner website URL
        -
          handle: website_text
          field:
            type: text
            display: Website Display Text
            instructions: The text to display for the website link
