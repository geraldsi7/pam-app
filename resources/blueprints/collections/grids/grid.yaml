title: Grid
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: heading
            field:
              type: text
              display: Heading
          -
            handle: description
            field:
              type: textarea
              display: Description
          -
            handle: featured_grid
            field:
              type: grid
              display: 'Featured Grid'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: description
                  field:
                    type: textarea
                    display: Description
                -
                  handle: featured_image
                  field:
                    max_files: 1
                    container: assets
                    type: assets
                    display: 'Featured Image'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
