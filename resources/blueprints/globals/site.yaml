title: 'Site Settings'
tabs:
  general:
    display: General
    sections:
      -
        fields:
          -
            handle: site_name
            field:
              type: text
              display: 'Site Name'
              required: true
              validate:
                - required
          -
            handle: site_tagline
            field:
              type: text
              display: 'Site Tagline'
              instructions: 'Brief tagline for the company'
          -
            handle: company_description
            field:
              type: textarea
              display: 'Company Description'
              instructions: 'Detailed company description for about pages'
  contact:
    display: Contact
    sections:
      -
        fields:
          -
            handle: contact_email
            field:
              type: text
              display: 'Contact Email'
              input_type: email
          -
            handle: contact_phone
            field:
              type: text
              display: 'Contact Phone'
          -
            handle: address_street
            field:
              type: text
              display: 'Street Address'
          -
            handle: address_city
            field:
              type: text
              display: City
          -
            handle: address_country
            field:
              type: text
              display: Country
          -
            handle: address_postal
            field:
              type: text
              display: 'Postal Code'
  branding:
    display: Branding
    sections:
      -
        fields:
          -
            handle: logo
            field:
              container: assets
              type: assets
              display: Logo
              max_files: 1
              mode: grid
          -
            handle: favicon
            field:
              container: assets
              type: assets
              display: Favicon
              max_files: 1
              mode: grid
          -
            handle: primary_color
            field:
              type: color
              display: 'Primary Color'
              default: '#1e40af'
          -
            handle: secondary_color
            field:
              type: color
              display: 'Secondary Color'
              default: '#f59e0b'
          -
            handle: accent_color
            field:
              type: color
              display: 'Accent Color'
              default: '#059669'
  social:
    display: Social Media
    sections:
      -
        fields:
          -
            handle: linkedin_url
            field:
              type: text
              display: 'LinkedIn URL'
              input_type: url
          -
            handle: twitter_url
            field:
              type: text
              display: 'Twitter URL'
              input_type: url
          -
            handle: facebook_url
            field:
              type: text
              display: 'Facebook URL'
              input_type: url
          -
            handle: instagram_url
            field:
              type: text
              display: 'Instagram URL'
              input_type: url
          -
            handle: youtube_url
            field:
              type: text
              display: 'YouTube URL'
              input_type: url
  business:
    display: Business Hours
    sections:
      -
        fields:
          -
            handle: business_hours_monday
            field:
              type: text
              display: Monday
              default: '09:00 - 18:00'
          -
            handle: business_hours_tuesday
            field:
              type: text
              display: Tuesday
              default: '09:00 - 18:00'
          -
            handle: business_hours_wednesday
            field:
              type: text
              display: Wednesday
              default: '09:00 - 18:00'
          -
            handle: business_hours_thursday
            field:
              type: text
              display: Thursday
              default: '09:00 - 18:00'
          -
            handle: business_hours_friday
            field:
              type: text
              display: Friday
              default: '09:00 - 18:00'
          -
            handle: business_hours_saturday
            field:
              type: text
              display: Saturday
              default: Closed
          -
            handle: business_hours_sunday
            field:
              type: text
              display: Sunday
              default: Closed
  analytics:
    display: Analytics
    sections:
      -
        fields:
          -
            handle: google_analytics_id
            field:
              type: text
              display: 'Google Analytics ID'
              instructions: 'GA4 Measurement ID (G-XXXXXXXXXX)'
  footer:
    display: Footer
    sections:
      -
        fields:
          -
            handle: copyright_text
            field:
              type: text
              display: 'Copyright Text'
              default: '© 2026 Plus Alliance Meridian Ltd. All rights reserved.'