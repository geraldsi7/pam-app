<main class="min-h-screen bg-gray-50">
    <!-- Product Hero Section -->
    <section class="bg-white py-16">
        <div class="mx-auto px-4">
            <div class="max-w-6xl mx-auto">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
                    <!-- Product Image -->
                    <div class="order-2 lg:order-1">
                        {{ if featured_image }}
                        <div class="bg-gray-100 rounded-lg overflow-hidden shadow-lg">
                            <img src="{{ featured_image:url }}" alt="{{ title }}" class="w-full h-auto object-cover">
                        </div>
                        {{ else }}
                        <div class="aspect-square bg-gray-100 rounded-lg flex items-center justify-center">
                            <svg class="w-24 h-24 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                        {{ /if }}
                    </div>

                    <!-- Product Info -->
                    <div class="order-1 lg:order-2">
                        <h1 class="text-4xl font-bold text-gray-900 mb-6">{{ title }}</h1>

                        {{ if description }}
                        <div class="prose prose-lg max-w-none mb-8">
                            <p class="text-gray-700 leading-relaxed">{{ description }}</p>
                        </div>
                        {{ /if }}
                    </div>
                </div>

                {{ if content }}
                <div class="prose prose-lg max-w-none my-8">
                    <p class="text-gray-700 leading-relaxed">{{ content }}</p>
                </div>
                {{ /if }}

            </div>
        </div>
    </section>

    <!-- CTA -->
    {{ collection:cta title:is="Ready to Get Started" }}
    {{ partial:cta }}
    {{ /collection:cta }}
</main>
