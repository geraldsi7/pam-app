<!-- Hero Section -->
<section class="relative bg-gradient-to-r from-blue-900 to-blue-800 text-white py-24 lg:py-32">
    <div class="absolute inset-0 bg-black bg-opacity-20"></div>
    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl">
            <h1 class="text-4xl lg:text-6xl font-bold mb-6">{{ title }}</h1>
            <p class="text-lg text-blue-100 mb-8">{{ description }}</p>
            <div class="flex flex-wrap gap-2">
                {{ industry_focus }}
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-800 text-blue-100">
                    {{ value | title }}
                </span>
                {{ /industry_focus }}
            </div>
        </div>
    </div>
</section>

<!-- Main Content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 lg:py-24">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
        <!-- Main Content -->
        <div class="lg:col-span-2">
            <div class="prose max-w-none mb-12">
                {{ content | markdown }}
            </div>
        </div>

        <!-- Sidebar -->
        <div class="lg:col-span-1">
            <!-- Featured Image -->
            {{ if featured_image }}
            <div class="bg-white rounded-lg shadow-sm p-6 mb-8">
                <img src="{{ glide:featured_image width='400' height='300' fit='crop_focal' }}" alt="{{ title }}" class="w-full h-48 object-cover rounded-lg mb-4" loading="eager">
                <h3 class="text-lg font-semibold text-gray-900 mb-2">Service Overview</h3>
                <p class="text-gray-600 text-sm">{{ description }}</p>
            </div>
            {{ /if }}

            <!-- Gallery -->
            {{ if gallery }}
            <div class="bg-white rounded-lg shadow-sm p-6 mb-8">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Project Gallery</h3>
                <div class="grid grid-cols-2 gap-3">
                    {{ gallery }}
                    <img src="{{ glide:url width='200' height='150' fit='crop_focal' }}" alt="Gallery image" class="w-full h-20 object-cover rounded" loading="eager">
                    {{ /gallery }}
                </div>
            </div>
            {{ /if }}
        </div>
    </div>
</main>
