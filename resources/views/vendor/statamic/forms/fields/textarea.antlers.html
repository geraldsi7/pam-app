<textarea
    id="{{ id }}"
    name="{{ handle }}"
    rows="5"
    class="w-full px-4 py-3 border {{ if error }}border-red-500{{ else }}border-gray-300{{ /if }} rounded-lg focus:outline-none {{ if error }}focus:border-red-500 focus:shadow focus:shadow-red-500/20{{ else }}focus:border-blue-500 focus:shadow focus:shadow-blue-500/20{{ /if }} transition-colors resize-none"
    {{ if placeholder }}placeholder="{{ placeholder }}"{{ /if }}
    {{ if character_limit }}maxlength="{{ character_limit }}"{{ /if }}
    {{ if js_driver }}{{ js_attributes }}{{ /if }}
    {{ if validate|contains:required }}required{{ /if }}
    {{ if error }}
        aria-invalid="true" aria-describedby="{{ id }}-error"
    {{ elseif instructions }}
        aria-describedby="{{ id }}-instructions"
    {{ /if }}
>
    {{ old ?? value }}
</textarea>
