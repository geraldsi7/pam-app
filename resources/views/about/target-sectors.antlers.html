<main>
    <!-- Core Business Areas -->
    <section class="py-16 lg:py-24 bg-blue-900 text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="mb-12">
                <h2 class="text-3xl lg:text-5xl font-bold">Target Sectors</h2>
            </div>

            <div class="space-y-0">
                {{ collection:services }}
                <article
                    class="grid grid-cols-1 md:grid-cols-[80px_1.2fr_1fr] gap-6 py-8 {{ last ? '' : 'border-b border-white/15' }}">
                    <div class="text-blue-200 text-sm tracking-[0.2em] uppercase">{{ if count < 10 }}0{{ /if }}{{ count
                            }}</div>
                            <div>
                                <h3 class="text-2xl font-semibold leading-snug">{{ title }}</h3>
                            </div>
                            <div class="space-y-4">
                                <p class="text-blue-100 leading-relaxed">{{ description }}</p>
                            </div>
                </article>
                {{ /collection:services }}
            </div>
        </div>
    </section>

    {{ partial:contact/contact-form }}
</main>
