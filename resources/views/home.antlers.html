<!-- Header -->
<header id="main-header" class="bg-white fixed top-0 left-0 w-full z-50 transition-shadow duration-300">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center h-20">
            <a href="#" class="flex items-center gap-3 text-2xl font-black text-blue-800">
                <!-- Enhanced SVG Logo -->
                <svg class="h-10 w-10" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <clipPath id="waveClip">
                            <path d="M 0 100 C 20 100, 40 20, 60 20 S 80 100, 100 100 Z" />
                        </clipPath>
                    </defs>
                    <g clip-path="url(#waveClip)">
                        <rect x="0" y="0" width="100" height="100" fill="#005A9E" />
                    </g>
                    <path d="M 0 100 C 20 100, 40 20, 60 20 S 80 100, 100 100" fill="none" stroke="white"
                        stroke-width="8" />
                    <circle cx="85" cy="25" r="15" fill="#D92525" />
                </svg>
                <span>Mrican Technologies</span>
            </a>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex space-x-8" id="main-nav">
                <a href="#hero"
                    class="text-gray-600 font-bold hover:text-blue-800 pb-2 border-b-2 border-transparent transition-colors duration-300 nav-link-active">Home</a>
                <a href="#about"
                    class="text-gray-600 font-bold hover:text-blue-800 pb-2 border-b-2 border-transparent transition-colors duration-300">About
                    us</a>
                <a href="#services"
                    class="text-gray-600 font-bold hover:text-blue-800 pb-2 border-b-2 border-transparent transition-colors duration-300">Services</a>
                <a href="#support"
                    class="text-gray-600 font-bold hover:text-blue-800 pb-2 border-b-2 border-transparent transition-colors duration-300">Support</a>
                <a href="#contact"
                    class="text-gray-600 font-bold hover:text-blue-800 pb-2 border-b-2 border-transparent transition-colors duration-300">Contact</a>
            </nav>

            <a href="#contact"
                class="hidden md:inline-block bg-green-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-700 transition-transform duration-200 hover:-translate-y-1 shadow-md">Request
                a Demo</a>

            <!-- Mobile Menu Button -->
            <button id="mobile-menu-button" class="md:hidden text-2xl">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </div>
    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200">
        <a href="#hero" class="block py-3 px-4 text-gray-600 font-bold hover:bg-gray-100">Home</a>
        <a href="#about" class="block py-3 px-4 text-gray-600 font-bold hover:bg-gray-100">About us</a>
        <a href="#services" class="block py-3 px-4 text-gray-600 font-bold hover:bg-gray-100">Services</a>
        <a href="#support" class="block py-3 px-4 text-gray-600 font-bold hover:bg-gray-100">Support</a>
        <a href="#contact" class="block py-3 px-4 text-gray-600 font-bold hover:bg-gray-100">Contact</a>
    </div>
</header>

<main>
    {{ partial:partials/hero }}
    {{ partial:partials/partners }}
    {{ partial:partials/services }}
</main>
