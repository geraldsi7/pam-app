<main>
    {{ collection:hero title:is="Contact Hero" limit="1" }}
    {{ partial:hero }}
    {{ /collection:hero }}
    {{ partial:contact/faq }}
    {{ partial:contact/contact-form }}
    {{ collection:cta title:is="Explore Services" }}
    {{ partial:cta }}
    {{ /collection:cta }}
</main>

<script>
    // Contact Form Enhancement
    document.addEventListener('DOMContentLoaded', function () {
        const contactForm = document.getElementById('contact_us_form');
        // Auto-dismiss flash messages
        const successMessage = document.getElementById('success-message');
        const errorMessage = document.getElementById('error-message');

        if (successMessage) {
            setTimeout(() => {
                successMessage.style.opacity = '0';
                successMessage.style.transform = 'translateY(-20px)';
                setTimeout(() => {
                    successMessage.remove();
                }, 300);
            }, 5000);

            smoothScrollToElement(contactForm, 500);
        }

        if (errorMessage) {
            setTimeout(() => {
                errorMessage.style.opacity = '0';
                errorMessage.style.transform = 'translateY(-20px)';
                setTimeout(() => {
                    errorMessage.remove();
                }, 300);
            }, 8000); // Keep error messages longer

            smoothScrollToElement(contactForm, 500);
        }

        // Handle form submission with button disable and scroll
        if (contactForm) {
            const submitButton = contactForm.querySelector('button[type="submit"], input[type="submit"]');
            let originalButtonText = '';

            // Listen for form submission
            contactForm.addEventListener('submit', function (e) {
                // Store original button text
                originalButtonText = submitButton ? submitButton.textContent : '';

                // Disable submit button to prevent double submission
                if (submitButton) {
                    submitButton.disabled = true;
                    submitButton.textContent = 'Submitting...';
                }
            });
        }

        function smoothScrollToElement(element, duration) {
            if (!element) return; // Exit if element is not found

            const startTime = performance.now();
            const startPosition = window.pageYOffset;
            const targetPosition = element.getBoundingClientRect().top + window.pageYOffset;
            const distance = targetPosition - startPosition;

            function scrollStep(timestamp) {
                const timeElapsed = timestamp - startTime;
                const progress = Math.min(timeElapsed / duration, 1); // Ensure progress doesn't exceed 1

                window.scrollTo(0, startPosition + distance * progress);

                if (timeElapsed < duration) {
                    requestAnimationFrame(scrollStep);
                }
            }

            requestAnimationFrame(scrollStep);
        }

        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    });

</script>

<style>
    /* Additional styles for contact page */
    .fade-in-up {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.6s ease-out;
    }

    .fade-in-up.is-visible {
        opacity: 1;
        transform: translateY(0);
    }
    /* Animation for FAQ icons */
    .faq-icon {
        transition: transform 0.3s ease;
    }
</style>
