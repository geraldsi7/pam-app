
<section class="{{ index % 2 == 0 ? 'bg-white' : 'bg-gray-50' }} py-10">
    <div class="container mx-auto px-4">
        <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center">

            <!-- Left Column - Visual -->
            <div class="relative fade-in-up {{ order == 'image-first' ? 'order-1' : 'order-2' }}">
                <div class="p-8 lg:p-12">

                    <img src="{{featured_image:url}}" class="w-full h-auto object-cover">
                </div>
            </div>

            <!-- Right Column - Content -->
            <div class="space-y-8 fade-in-up {{ order == 'image-first' ? 'order-2' : 'order-1' }}">
                <!-- Section 1: Seamless ERP Experience -->
                <div class="space-y-4">
                    <h2 class="text-3xl lg:text-4xl font-bold text-blue-900 leading-tight">
                        {{ title }}
                    </h2>
                    <p class="text-lg text-gray-600 leading-relaxed">
                        {{ description }}
                    </p>
                </div>

                <!-- Call to Action -->
                <div>
                    <a href="{{ url }}"
                        class="inline-flex items-center gap-2 text-red-600 font-semibold hover:text-red-700 transition-colors group">
                        <span>View Product</span>
                        <i class="fas fa-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
