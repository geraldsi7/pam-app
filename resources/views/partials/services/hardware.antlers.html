{{ collection:services slug:is="hardware-solution" }}
<section class="bg-white py-16 lg:py-24">
    <div class="container mx-auto px-4">
        <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center">

            <!-- Left Column - Visual -->
            <div class="relative fade-in-up order-2">
                <div class="bg-white p-8 lg:p-12">
                    <!-- Hardware Setup Mockup -->
                    <img src="{{ featured_image:url }}" alt="{{ featured_image:alt }}" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Right Column - Content -->
            <div class="space-y-8 fade-in-up">
                <!-- Section 1: Complete Hardware Solutions -->
                {{ heading }}
                <div class="space-y-4">
                    <h2 class="text-3xl lg:text-4xl font-bold text-blue-900 leading-tight">
                        {{ title }}
                    </h2>
                    <p class="text-lg text-gray-600 leading-relaxed">
                        {{ description }}
                    </p>

                    <!-- Hardware Categories List -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-6">
                        {{ featured_categories }}
                        <div class="flex items-center gap-3">
                            <div class="w-5 h-5 bg-red-500 rounded-full flex items-center justify-center">
                                <i class="fas fa-check text-white text-xs"></i>
                            </div>
                            <span class="text-gray-700 font-medium">{{ title }}</span>
                        </div>
                        {{ /featured_categories }}
                    </div>
                </div>
                {{ /heading }}

                <!-- Call to Action -->
                <div>
                    <a href="#contact"
                        class="inline-flex items-center gap-2 text-red-600 font-semibold hover:text-red-700 transition-colors group">
                        <span>{{ redirect_url_text }}</span>
                        <i class="fas fa-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
                    </a>
                </div>
            </div>
        </div>
</section>
{{ /collection:services }}
