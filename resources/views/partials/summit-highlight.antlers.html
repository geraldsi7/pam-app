<section class="py-16 lg:py-24 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Summit Highlights Header -->
        <div class="text-center mb-16">
            <h2 class="text-3xl lg:text-4xl font-bold text-blue-900 mb-4">
                Summit Highlights
            </h2>
            <p class="text-lg text-gray-600 max-w-3xl mx-auto">
                A glimpse into the world-class experience that awaits delegates at the Africa-China Business & Investment .
            </p>
        </div>

        <!-- Image Grid -->
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 max-w-5xl mx-auto">
            {{ collection:highlights limit="6" }}
            <div class="relative rounded-lg overflow-hidden group cursor-pointer aspect-[3/2]"
                style="opacity: 1; transform: none;">
                <img
                    src="{{ glide:featured_image width='600' height='400' fit='crop' }}"
                    alt="Summit session" loading="lazy"
                    class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                <div
                    class="absolute inset-0 bg-[hsl(220,30%,12%,0)] group-hover:bg-[hsl(220,30%,12%,0.3)] transition-colors">
                </div>
            </div>
            {{ /collection:highlights }}             
        </div>
    </div>
</section>
