<!-- Article Card Component -->

<section class="article-content {{ index % 2 == 0 ? 'bg-white' : 'bg-gray-50' }} py-16 lg:py-24">
    <div class="max-w-5xl mx-auto px-4">
        <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center">

            <!-- Left Column - Visual -->
            <div class="relative fade-in-up {{ order == 'image-first' ? 'order-1' : 'order-2' }}">
                <div class="h-72 lg:h-96">
                    <img src="{{ featured_image }}" class="w-full h-full object-cover rounded-sm" loading="lazy">
                </div>
            </div>

            <!-- Right Column - Content -->
            <div class="space-y-8 fade-in-up {{ order == 'image-first' ? 'order-2' : 'order-1' }}">
                <div class="space-y-6">
                    <h1 class="text-3xl md:text-4xl font-bold text-blue-900">
                        {{ heading }}
                    </h1>
                    <div class="prose max-w-none">
                        <div class="lg:text-lg text-gray-600 leading-relaxed">
                            {{ content }}
                        </div>
                    </div>
                </div>

                <!-- Call to Action -->
                {{ if button_url }}
                <div>
                    {{ partial:link-button url="{{ button_url }}" text="{{ button_text }}" }}
                </div>
                {{ /if }}
            </div>
        </div>
    </div>
</section>
