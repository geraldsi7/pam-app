<section id="hero">
    {{ if main}}
    <div class="main-hero hero-section">
        <div class="max-w-7xl mx-auto px-4 relative z-10">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                <div class="order-2 lg:order-1 flex flex-col justify-center">
                    <h1 class="text-4xl md:text-5xl font-extrabold text-blue-900 mb-6 fade-in-up">
                        {{ heading }}
                    </h1>
                    <p class="text-lg leading-relaxed text-gray-600 mb-8 fade-in-up" style="transition-delay: 150ms;">
                        {{ description }}
                    </p>
                </div>

                <div class="order-1 lg:order-2 hero-img">
                    <img src="{{ featured_image:url }}" alt="hero" class="max-w-full h-auto object-cover animated">
                </div>
            </div>

        </div>
    </div>
    {{ else }}
    <div class="bg-gradient-to-br from-blue-50 to-red-50 py-20">
        <div class="mx-auto px-4">
            <div class="text-center fade-in-up">
                <h1 class="text-4xl md:text-6xl font-bold text-blue-900 mb-6">{{ heading }}</h1>
                <p class="text-xl text-gray-600 max-w-3xl mx-auto leading-relaxed">
                    {{ description}}
                </p>
            </div>
        </div>
    </div>
    {{ /if }}
</section>
