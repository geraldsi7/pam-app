<!-- Hero Section -->
{{ collection:hero limit="1" }}
<section id="hero" class="bg-red-50 pt-20 pb-20 relative overflow-hidden">
                <!-- World Map Background -->
            <div class="absolute inset-0 opacity-10">
                <svg class="w-full h-full" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
                    <!-- Simplified world map outline focusing on Africa, Europe, Asia, and Americas -->
                    <path d="M 200 300 Q 250 280 300 290 Q 350 300 400 320 Q 450 340 500 350 Q 550 360 600 370 Q 650 380 700 390 Q 750 400 800 410 Q 850 420 900 430 Q 950 440 1000 450" 
                          fill="none" stroke="#dc2626" stroke-width="2"/>
                    <!-- Africa outline -->
                    <path d="M 550 200 Q 580 180 600 190 Q 620 200 640 220 Q 660 240 680 260 Q 700 280 720 300 Q 740 320 760 340 Q 780 360 800 380 Q 820 400 840 420 Q 860 440 880 460 Q 900 480 920 500 Q 940 520 960 540 Q 980 560 1000 580" 
                          fill="none" stroke="#dc2626" stroke-width="2"/>
                    <!-- Europe outline -->
                    <path d="M 500 150 Q 520 140 540 145 Q 560 150 580 160 Q 600 170 620 180 Q 640 190 660 200 Q 680 210 700 220 Q 720 230 740 240 Q 760 250 780 260 Q 800 270 820 280" 
                          fill="none" stroke="#dc2626" stroke-width="2"/>
                    <!-- Asia outline -->
                    <path d="M 800 200 Q 850 180 900 190 Q 950 200 1000 220 Q 1050 240 1100 260 Q 1150 280 1200 300" 
                          fill="none" stroke="#dc2626" stroke-width="2"/>
                    <!-- Americas outline -->
                    <path d="M 100 200 Q 150 180 200 190 Q 250 200 300 220 Q 350 240 400 260 Q 450 280 500 300" 
                          fill="none" stroke="#dc2626" stroke-width="2"/>
                </svg>
            </div>

    <div class="container mx-auto px-4 relative z-10">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
            <!-- Left Content -->
            <div class="text-left">
                <h1 class="text-4xl md:text-5xl font-extrabold text-blue-900 mb-6 fade-in-up">
                    {{ title }}
                </h1>
                <p class="text-lg md:text-xl text-blue-900 mb-8 fade-in-up" style="transition-delay: 150ms;">
                    {{ content }}
                </p>
            </div>

            <!-- Right Content - World Map with Icons -->
            <div class="relative">
                <div class="relative w-full h-96 lg:h-[500px]">
                    <!-- World Map with Icons -->
                    <div class="absolute inset-0">
                        <svg class="w-full h-full" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
                            <!-- World map background -->
                            <path d="M 200 300 Q 250 280 300 290 Q 350 300 400 320 Q 450 340 500 350 Q 550 360 600 370 Q 650 380 700 390 Q 750 400 800 410 Q 850 420 900 430 Q 950 440 1000 450" 
                                  fill="none" stroke="#dc2626" stroke-width="3" opacity="0.3"/>
                            
                            <!-- Africa outline -->
                            <path d="M 550 200 Q 580 180 600 190 Q 620 200 640 220 Q 660 240 680 260 Q 700 280 720 300 Q 740 320 760 340 Q 780 360 800 380 Q 820 400 840 420 Q 860 440 880 460 Q 900 480 920 500 Q 940 520 960 540 Q 980 560 1000 580" 
                                  fill="none" stroke="#dc2626" stroke-width="3" opacity="0.3"/>
                            
                            <!-- Europe outline -->
                            <path d="M 500 150 Q 520 140 540 145 Q 560 150 580 160 Q 600 170 620 180 Q 640 190 660 200 Q 680 210 700 220 Q 720 230 740 240 Q 760 250 780 260 Q 800 270 820 280" 
                                  fill="none" stroke="#dc2626" stroke-width="3" opacity="0.3"/>
                            
                            <!-- Asia outline -->
                            <path d="M 800 200 Q 850 180 900 190 Q 950 200 1000 220 Q 1050 240 1100 260 Q 1150 280 1200 300" 
                                  fill="none" stroke="#dc2626" stroke-width="3" opacity="0.3"/>
                            
                            <!-- Americas outline -->
                            <path d="M 100 200 Q 150 180 200 190 Q 250 200 300 220 Q 350 240 400 260 Q 450 280 500 300" 
                                  fill="none" stroke="#dc2626" stroke-width="3" opacity="0.3"/>
                            
                            <!-- Mrican Logo Icon (West Africa) -->
                            <circle cx="650" cy="350" r="20" fill="#1e40af" opacity="0.8"/>
                            <text x="650" y="355" text-anchor="middle" fill="white" font-size="12" font-weight="bold">M</text>
                            
                            <!-- Success Icons -->
                            <circle cx="550" cy="200" r="15" fill="#dc2626" opacity="0.8"/>
                            <text x="550" y="205" text-anchor="middle" fill="white" font-size="10" font-weight="bold">✓</text>
                            
                            <circle cx="700" cy="180" r="15" fill="#dc2626" opacity="0.8"/>
                            <text x="700" y="185" text-anchor="middle" fill="white" font-size="10" font-weight="bold">✓</text>
                            
                            <circle cx="950" cy="250" r="15" fill="#dc2626" opacity="0.8"/>
                            <text x="950" y="255" text-anchor="middle" fill="white" font-size="10" font-weight="bold">✓</text>
                            
                            <circle cx="300" cy="250" r="15" fill="#dc2626" opacity="0.8"/>
                            <text x="300" y="255" text-anchor="middle" fill="white" font-size="10" font-weight="bold">✓</text>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{{ /collection:hero }}
