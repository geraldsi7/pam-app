<section id="hero">
    {{ if main}}
    <section id="hero" class="relative overflow-hidden min-h-screen flex items-center justify-center">
        <!-- Background Video/Image -->
        <div class="hero-video-container absolute inset-0 z-0">
            <!-- Fallback to background image since no video file exists -->
            <!-- <div class="w-full h-full bg-cover bg-center bg-no-repeat" style="background-image: url('{{ featured_image:url }}')"></div> -->
            <iframe src="https://player.vimeo.com/video/386523330?background=1" frameborder="0"
                allow="autoplay; fullscreen" allowfullscreen="true" aria-label="Homepage hero video" loading="eager"></iframe>
            <!-- Video will be enabled once video file is added to /assets/hero-video.mp4 -->
            <!-- <video autoplay muted loop playsinline class="w-full h-full object-cover" poster="{{ featured_image:url }}">
                <source src="/assets/hero-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video> -->

            <!-- Overlay -->
            <div class="absolute inset-0 bg-blue-900/85 z-10"></div>
        </div>

        <!-- Content -->
        <div class="relative z-20 md:max-w-2xl lg:max-w-7xl mx-auto px-8 md:px-4 lg:text-center">
            <h1 class="text-3xl md:text-6xl font-bold md:font-extrabold text-white mb-6 fade-in-up">
                {{ heading }}
            </h1>
            <p class="md:text-lg leading-relaxed text-blue-50 mb-10 max-w-3xl lg:max-w-4xl mx-auto fade-in-up"
                style="transition-delay: 150ms;">
                {{ description }}
            </p>
            <div class="flex flex-col sm:flex-row justify-start lg:justify-center gap-4 fade-in-up"
                style="transition-delay: 300ms;">
                <a href="{{ primary_button_link }}"
                    class="px-8 py-4 bg-white text-blue-900 hover:bg-blue-900 hover:text-white font-bold rounded-sm transition-colors duration-300 ease-in-out">
                    {{ primary_button_text }}
                </a>
            </div>
        </div>
    </section>
    {{ else }}
    <!-- Hero Section -->
    <section class="relative bg-gradient-to-r from-blue-900 to-blue-800 text-white py-24 lg:py-32">
        <div class="absolute inset-0 bg-black bg-opacity-20"></div>
        <div class="relative md:max-w-2xl lg:max-w-7xl mx-auto px-8 md:px-4">
            <div class="max-w-3xl fade-in-up">
                <h1 class="text-3xl md:text-6xl font-bold md:font-extrabold text-white mb-6">{{ heading ?? title }}</h1>
                <p class="md:text-lg leading-relaxed text-blue-50 mb-10 max-w-3xl lg:max-w-4xl mx-auto fade-in-up"
                style="transition-delay: 150ms;">
                {{ description }}
            </p>
                <div class="flex flex-wrap gap-2">
                    {{ industry_focus }}
                    <span
                        class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-800 text-blue-100">
                        {{ value | title }}
                    </span>
                    {{ /industry_focus }}
                </div>
            </div>
        </div>
    </section>
    {{ /if }}
</section>
