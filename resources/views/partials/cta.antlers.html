<!-- CTA -->
<section class="py-16 overflow-hidden"
    style="background-image: linear-gradient(90deg, rgba(10, 16, 28, 0.92) 0%, rgba(10, 16, 28, 0.82) 50%, rgba(10, 16, 28, 0.55) 70%, rgba(10, 16, 28, 0.22) 88%, rgba(10, 16, 28, 0.08) 100%), url('/assets/hero-bg-_jqkiaki.jpg'); background-size: cover; background-position: right center; background-repeat: no-repeat;">

    <div class="px-4">
        <div class="p-8 lg:p-12">
            <div class="grid lg:grid-cols-2 gap-8 items-center">
                <!-- Left Content -->
                <div class="space-y-4">
                    {{ if subtitle }}
                    <p class="text-xs tracking-[0.25em] uppercase text-[hsl(42,80%,50%)] font-semibold">
                        {{ subtitle }}
                    </p>
                    {{ /if }}
                    <h2 class="text-3xl lg:text-4xl font-bold text-white leading-tight">
                        {{ heading }}
                    </h2>
                    {{ if description }}
                    <p class="text-lg text-white leading-relaxed">
                        {{ description }}
                    </p>
                    {{ /if }}
                </div>

                <!-- Right CTA Button -->
                <div class="flex justify-center lg:justify-end">
                    {{ partial:link-button url="{{ button_url }}" text="{{ button_text }}" }}
                </div>
            </div>
        </div>
    </div>
</section>
