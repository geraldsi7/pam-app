<!-- CTA -->
<section class="py-16 bg-white relative overflow-hidden">
    <div class="absolute inset-0 opacity-5">
        <div class="absolute inset-0"
            style="background-image: radial-gradient(circle, #000 1px, transparent 1px); background-size: 20px 20px;">
        </div>
    </div>

    <div class="px-4 relative z-10">
        <div class="p-8 lg:p-12">
            <div class="grid lg:grid-cols-2 gap-8 items-center">
                <!-- Left Content -->
                <div class="space-y-4">
                    {{ if subtitle }}
                    <p class="text-xs tracking-[0.18em] uppercase text-blue-700 font-semibold">
                        {{ subtitle }}
                    </p>
                    {{ /if }}
                    <h2 class="text-3xl lg:text-4xl font-bold text-blue-900 leading-tight">
                        {{ heading }}
                    </h2>
                    {{ if description }}
                    <p class="text-lg text-gray-600 leading-relaxed">
                        {{ description }}
                    </p>
                    {{ /if }}
                </div>

                <!-- Right CTA Button -->
                <div class="flex justify-center lg:justify-end">
                    {{ partial:link-button url="{{ button_url }}" text="{{ button_text }}" }}
                </div>
            </div>
        </div>
    </div>
</section>
