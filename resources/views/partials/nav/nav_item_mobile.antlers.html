{{ if children || mount }}
    <div class="border-b border-gray-100">
        <div class="flex items-center justify-between px-4 py-3">
            <span class="text-blue-900 font-medium">{{ title }}</span>
            <i class="fas fa-chevron-down text-xs text-gray-400"></i>
        </div>
        <div class="bg-gray-50">
            {{ if mount }}
                {{ collection :from="mount" }}
                    <a href="{{ url }}" class="block py-2 px-8 text-gray-700 hover:bg-gray-50 text-sm">
                        {{ title }}
                    </a>
                {{ /collection }}
            {{ else }}
                {{ children }}
                    <a href="{{ url }}" class="block py-2 px-8 text-gray-700 hover:bg-gray-50 text-sm">
                        {{ title }}
                    </a>
                {{ /children }}
            {{ /if }}
        </div>
    </div>
{{ else }}
    <a href="{{ url }}" class="block py-3 px-4 text-blue-900 font-medium hover:bg-gray-100 border-b border-gray-100">{{ title }}</a>
{{ /if }}
