{{ if children || mount }}
    <div class="border-b border-gray-100">
        <button class="mobile-submenu-toggle flex items-center justify-between w-full px-4 py-3 text-left font-medium hover:bg-gray-50 hover:text-blue-700 transition-colors" aria-expanded="false">
            <span>{{ title }}</span>
            <i class="fas fa-chevron-down text-xs text-gray-400 transition-transform duration-200"></i>
        </button>
        <div class="mobile-submenu bg-gray-50 overflow-hidden max-h-0 transition-all duration-300 ease-in-out">
            <div class="py-2">
                {{ if mount }}
                    {{ collection :from="mount" }}
                        <a href="{{ url }}" class="mobile-nav-link block py-2 px-8 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 transition-colors" {{ slug == "register" || title == "Register" ? "target='_blank'" : "" }}>
                            {{ title }}
                        </a>
                    {{ /collection }}
                {{ else }}
                    {{ children }}
                        <a href="{{ url }}" class="mobile-nav-link block py-2 px-8 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 transition-colors" {{ slug == "register" || title == "Register" ? "target='_blank'" : "" }}>
                            {{ title }}
                        </a>
                    {{ /children }}
                {{ /if }}
            </div>
        </div>
    </div>
{{ else }}
    <a href="{{ url }}" {{ slug == "register" || title == "Register" ? "target='_blank'" : "" }} class="mobile-nav-link block py-3 px-4 font-medium hover:bg-gray-50 hover:text-blue-700 transition-colors border-b border-gray-100">{{ title }}</a>
{{ /if }}
