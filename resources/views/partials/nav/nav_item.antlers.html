{{ if children || mount }}
    <!-- Parent page with children or mounted collection - Dropdown -->
    <div class="relative group">
        <button
            class="font-medium hover:text-blue-600 flex items-center gap-1">
            {{ title }}
            <i class="fas fa-chevron-down text-xs"></i>
        </button>
        <!-- Dropdown Menu -->
        <div
            class="absolute top-full left-0 mt-2 w-64 bg-white border border-gray-200 rounded-lg shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <div class="py-2">
            {{ if mount }}
                {{ collection :from="mount" }}
                    <a href="{{ url }}" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-blue-900 text-sm">
                        {{ title }}
                    </a>
                {{ /collection }}
            {{ else }}
                {{ children }}
                    <a href="{{ url }}" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 hover:text-blue-900 text-sm">
                        {{ title }}
                    </a>
                {{ /children }}
            {{ /if }}
        </div>
        </div>
    </div>
{{ else }}
    <!-- Regular page without children -->
    {{ if slug == "register" || title == "Register" }}
        <a href="{{ url }}" target="_blank"
            class="register-cta inline-block font-semibold px-5 py-2 rounded-sm transition-all duration-300 capitalize bg-white text-blue-900 hover:bg-gray-100">
            {{ title }}
        </a>
    {{ else }}
        <a href="{{ url }}" class="font-medium hover:text-blue-600">{{ title }}</a>
    {{ /if }}
{{ /if }}
