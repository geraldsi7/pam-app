<!-- Hero Section -->
{{ collection:hero title:is="Home Hero" }}
<section id="hero" class="home-hero pt-20 pb-20 relative overflow-hidden">
    <div class="container mx-auto px-4 relative z-10">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
            <!-- Left Content -->
            <div class="text-left">
                <h1 class="text-4xl md:text-5xl font-extrabold text-blue-900 mb-6 fade-in-up">
                    {{ heading }}
                </h1>
                <p class="text-lg leading-relaxed text-gray-600 mb-8 fade-in-up" style="transition-delay: 150ms;">
                    {{ description }}
                </p>
            </div>
        </div>
    </div>
</section>
{{ /collection:hero }}
