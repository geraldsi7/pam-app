<!-- Hero Section -->
{{ collection:hero title:is="About Us Hero" }}
<section class="bg-gradient-to-br from-blue-50 to-red-50 py-20">
    <div class="container mx-auto px-4">
        <div class="text-center fade-in-up">
            <h1 class="text-4xl md:text-6xl font-bold text-blue-900 mb-6">{{ heading }}</h1>
            <p class="text-xl text-gray-600 max-w-3xl mx-auto leading-relaxed">
                {{ description}}
            </p>
            <div class="mt-8 flex justify-center">
                <div>
                    <span class="text-blue-900 font-semibold">Est. 1989</span>
                </div>
            </div>
        </div>
    </div>
</section>
{{ /collection:hero }}
