<section class="py-16 {{ bg_color ?? 'bg-white' }}">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-start">
            <div class="relative fade-in-up {{ image_position == 'left' ? 'order-1' : 'order-2' }}">
                {{ if slug != 'company-overview' }}
                <div>
                    <img src="{{ glide:featured_image width='900' height='620' fit='crop_focal' }}" alt="{{ title }}"
                        class="w-full h-80 lg:h-[28rem] object-cover" loading="eager">
                </div>
                {{ else }}
                <div class="grid grid-cols-2 gap-4" style="opacity: 1; transform: none;"><img
                        src="/assets/solar-farm-jdlUEqY3.jpg" alt="Solar energy operations"
                        class="rounded-lg h-48 w-full object-cover"><img src="/assets/construction-DYC96YdC.jpg"
                        alt="Construction projects" class="rounded-lg h-48 w-full object-cover mt-8"><img
                        src="/assets/trade-logistics-CLS_-9d1.jpg" alt="Trade logistics"
                        class="rounded-lg h-48 w-full object-cover"><img src="/assets/hero-mining-BW2AHXKO.jpg"
                        alt="Mining operations" class="rounded-lg h-48 w-full object-cover mt-8"></div>

                {{ /if }}
            </div>

            <div class="space-y-6 fade-in-up {{ image_position == 'left' ? 'order-2' : 'order-1' }}">
                {{ if eyebrow }}
                <p class="text-xs tracking-[0.25em] uppercase text-[hsl(42,80%,50%)] font-semibold">{{ eyebrow }}</p>
                {{ /if }}

                <h2 class="text-3xl md:text-4xl font-bold text-blue-900 leading-tight">
                    {{ heading }}
                </h2>

                <div class="text-gray-600 leading-relaxed space-y-4 text-base lg:text-lg">
                    {{ content ?? excerpt ?? description | markdown }}
                </div>

                {{ if button_url && button_text }}
                <div>
                    {{ partial:link-button url="{{ button_url }}" text="{{ button_text }}" }}
                </div>
                {{ /if }}
            </div>
        </div>
    </div>
</section>
