<!-- FAQ Section -->
<section id="contact-faq" class="py-16 bg-blue-50">
    <div class="container mx-auto px-4">
        <div class="max-w-4xl mx-auto">
            <div class="mb-12 fade-in-up">
                <p class="font-semibold text-xl text-gray-600">Here are some of the most frequently asked questions</p>
            </div>
            
            <div class="space-y-6 fade-in-up" style="transition-delay: 150ms;">
                <!-- FAQ Item 1 -->
                {{ collection:faqs }}
                <div class="faq-item bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <button class="w-full px-6 py-4 text-left flex justify-between items-center hover:bg-gray-50 transition-colors faq-toggle" data-target="faq-{{ index }}">
                        <h3 class="text-lg font-semibold text-blue-900">{{ title }}</h3>
                        <i class="fas fa-chevron-down text-blue-900 transition-transform duration-200 faq-icon"></i>
                    </button>
                    <div id="faq-{{ index }}" class="hidden px-6 pb-4">
                        <p class="text-gray-600 leading-relaxed">
                            {{ content }}
                        </p>
                    </div>
                </div>
                {{ /collection:faqs }}               
                            
            </div>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // FAQ Toggle Functionality
    const faqToggles = document.querySelectorAll('.faq-toggle');
    
    faqToggles.forEach(toggle => {
        toggle.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const target = document.getElementById(targetId);
            const icon = this.querySelector('.faq-icon');
            
            // Close all other FAQs
            faqToggles.forEach(otherToggle => {
                if (otherToggle !== this) {
                    const otherTargetId = otherToggle.getAttribute('data-target');
                    const otherTarget = document.getElementById(otherTargetId);
                    const otherIcon = otherToggle.querySelector('.faq-icon');
                    
                    otherTarget.classList.add('hidden');
                    otherIcon.style.transform = 'rotate(0deg)';
                }
            });
            
            // Toggle current FAQ
            if (target.classList.contains('hidden')) {
                target.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                target.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        });
    });
});
</script>
