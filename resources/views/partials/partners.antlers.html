<!-- Partners Section -->
{{ collection:partners limit="1" }}
<section class="py-16 lg:py-24 bg-white relative overflow-hidden">
    <div class="max-w-7xl mx-auto px-4 relative z-10">
        <!-- Top Section: API Documentation -->
        <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center mb-20">

            <!-- Left Column - Content -->
            <div class="space-y-6 fade-in-up">
                <h2 class="text-3xl lg:text-4xl font-bold text-blue-900 leading-tight">
                    {{ title }}
                </h2>
                <p class="text-lg text-gray-600 leading-relaxed">
                    {{ description }}
                </p>
            </div>
        </div>


        <!-- Partners Slider -->
        <div class="relative overflow-hidden">
            <div class="my-slider js-partners-slider">
                {{ partners }}
                {{ if featured && featured_image }}
                <div class="px-2 sm:px-3 md:px-4">
                    <div class="duration-300 flex items-center justify-center h-20 sm:h-16 md:h-24">
                        <img src="{{ glide:featured_image }}" alt="{{ title }} logo" class="w-auto h-16 sm:h-10 md:h-20 object-contain"
                            loading="eager">
                    </div>
                </div>
                {{ /if }}
                {{ /partners }}
            </div>
        </div>

    </div>
</section>
{{ /collection:partners }}
