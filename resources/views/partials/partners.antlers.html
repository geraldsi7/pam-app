<!-- Partners Section -->
{{ collection:partners limit="1" }}
<section class="py-16 lg:py-24 bg-gray-50 relative overflow-hidden">
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-5">
        <div class="absolute inset-0"
            style="background-image: radial-gradient(circle, #000 1px, transparent 1px); background-size: 20px 20px;">
        </div>
    </div>

    <div class="container mx-auto px-4 relative z-10">
        <!-- Top Section: API Documentation -->
        <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center mb-20">

            <!-- Left Column - Content -->
            <div class="space-y-6 fade-in-up">
                <h2 class="text-3xl lg:text-4xl font-bold text-blue-900 leading-tight">
                    {{ title }}
                </h2>
                <p class="text-lg text-gray-600 leading-relaxed">
                    {{ description }}
                </p>
            </div>
        </div>


        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            {{ partners }}
            <div class="bg-white rounded-xl shadow p-8 transition-shadow duration-300 fade-in-up flex flex-col h-full">
                <!-- Logo/Company Name -->
                <div class="mb-6">
                    <h3 class="text-xl font-bold text-blue-900 mb-2">{{ title }}</h3>
                    <div class="flex items-center gap-2">
                        <img src="{{ flag:url }}" alt="{{ country }} flag" class="w-7 h-7 object-cover">
                        <span class="text-sm text-gray-600">{{ country }}</span>
                    </div>
                </div>

                <!-- Description -->
                <div class="flex-grow mb-6">
                    <p class="text-gray-700 leading-relaxed text-sm">
                        {{ description }}
                    </p>
                </div>

                <!-- Website Link -->
                <div class="pt-4 border-t border-gray-100 mt-auto">
                    <a href="{{ website }}" target="_blank" rel="noopener noreferrer"
                        class="inline-flex items-center text-blue-600 hover:text-blue-800 font-medium transition-colors duration-200">
                        <span>{{ website_text }}</span>
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                        </svg>
                    </a>
                </div>
            </div>
            {{ /partners }}
        </div>

    </div>
</section>
{{ /collection:partners }}
