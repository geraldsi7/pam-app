<!-- Partners Section -->
{{ collection:partners limit="1" }}
<section id="partners" class="py-16">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl md:text-4xl font-bold text-blue-900 text-center mb-12 fade-in-up">{{ heading }}</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
            {{ partners }}
            <div class="partner-card fade-in-up" style="transition-delay: {{ index * 100 }}ms;">
                <i class="fa-solid fa-map-pin text-5xl text-red-500 mb-4"></i>
                <h3 class="text-xl font-bold mb-2 text-blue-900">{{ country }}</h3>
                <a href="{{ website }}" target="_blank"
                    class="text-blue-900 hover:text-red-600 font-medium transition-colors">{{ website_text }}</a>
            </div>
            {{ /partners }}
        </div>
    </div>
</section>
{{ /collection:partners }}
