<!-- Partners Section -->
{{ collection:partners limit="1" }}
<section class="py-16 lg:py-24 bg-white relative overflow-hidden">
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-5">
        <div class="absolute inset-0"
            style="background-image: radial-gradient(circle, #000 1px, transparent 1px); background-size: 20px 20px;">
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 relative z-10">
        <!-- Top Section: API Documentation -->
        <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center mb-20">

            <!-- Left Column - Content -->
            <div class="space-y-6 fade-in-up">
                <h2 class="text-3xl lg:text-4xl font-bold text-blue-900 leading-tight">
                    {{ title }}
                </h2>
                <p class="text-lg text-gray-600 leading-relaxed">
                    {{ description }}
                </p>
            </div>
        </div>


        <!-- Partners Slider -->
        <div class="relative overflow-hidden">
            <div class="partners-slider flex w-max">
                {{ loop :times="2" }}
                <div class="partners-group flex items-center flex-shrink-0 gap-4 sm:gap-6 md:gap-8 pr-4 sm:pr-6 md:pr-8">
                    {{ partners }}
                    {{ if featured && featured_image }}
                    <div
                        class="flex-shrink-0 duration-300 w-32 sm:w-40 md:w-48 flex items-center justify-center">
                        <img src="{{ glide:featured_image }}" alt="{{ title }} logo" class="w-auto h-16 sm:h-10 md:h-20 object-contain" loading="eager">
                    </div>
                    {{ /if }}
                    {{ /partners }}
                </div>
                {{ /loop }}
            </div>
        </div>

    </div>
</section>
{{ /collection:partners }}
