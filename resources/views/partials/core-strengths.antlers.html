<!-- Our Strength Section -->
<section class="py-20 bg-gradient-to-br from-blue-900 to-red-800 text-white">
    <div class="container mx-auto px-4">
        <div class="text-center mb-16 fade-in-up">
            <h2 class="text-3xl font-bold mb-4">Our Core Strength</h2>
            <p class="text-xl text-blue-100">What sets us apart from the competition</p>
        </div>
        <div class="grid md:grid-cols-2 gap-12 items-center">
            <div class="fade-in-up">
                <div class="space-y-6">
                    {{ collection:core_strengths }}
                    <div class="flex items-start space-x-4">
                        <div
                            class="bg-white bg-opacity-20 w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="{{ icon }} text-xl"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-semibold mb-2">{{ title }}</h3>
                            <p class="text-blue-100">{{ description }}</p>
                        </div>
                    </div>
                    {{ /collection:core_strengths }}
                </div>
            </div>
            <div class="fade-in-up">
                <div class="bg-white bg-opacity-10 rounded-2xl p-8 backdrop-blur-sm">
                    <h3 class="text-2xl font-bold mb-6">Why Choose Mrican?</h3>
                    <ul class="space-y-4">
                        {{ collection:why_choose }}
                        <li class="flex items-center space-x-3">
                            <i class="fas fa-check-circle text-red-400"></i>
                            <span>{{ title }}</span>
                        </li>
                        {{ /collection:why_choose }}
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>
