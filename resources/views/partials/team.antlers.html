<section class="py-16 lg:py-24 bg-white relative overflow-hidden fade-in-up">
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-5">
        <div class="absolute inset-0"
            style="background-image: radial-gradient(circle, #000 1px, transparent 1px); background-size: 20px 20px;">
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">

        <!-- Left Column - Content -->
        <div class="text-center mb-12 fade-in-up">
            <h2 class="text-3xl lg:text-4xl font-bold text-blue-900 mb-4">
                Our Organizing Partners
            </h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-12">
            {{ collection:team }}
            <article class="bg-transparent rounded-lg transition-shadow overflow-hidden">
                <div class="aspect-square bg-gray-200">
                    {{ if photo }}
                    <img src="{{ glide:photo width='400' height='400' fit='crop' }}" alt="{{ title }}"
                        class="w-full h-full object-cover" loading="eager">
                    {{ else }}
                    <div 
                        class="w-full h-full bg-gradient-to-br from-blue-900 to-blue-700 flex items-center justify-center">
                        <i class="fas fa-user text-white text-2xl"></i>
                    </div>
                    {{ /if }}
                </div>
                <div class="my-2 space-y-1">
                    <h3 class="font-medium text-gray-900">
                        {{ name }}
                    </h3>
                    <p class="text-sm text-blue-900">{{ title }}</p>
                </div>
            </article>
            {{ no_results }}
            <!-- No Team Members Available -->
            <div class="col-span-full max-w-4xl mx-auto">
                <div class="text-center">
                    <h3 class="text-xl md:text-2xl font-semibold mb-4 text-gray-800">
                        No team members available at the moment
                    </h3>
                    <p class="opacity-80 text-gray-600">
                        Check back soon for the latest team members.
                    </p>
                </div>
            </div>
            {{ /no_results }}
            {{ /collection:team }}
        </div>
    </div>
</section>
