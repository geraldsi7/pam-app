<!DOCTYPE html>
<html lang="{{ site:short_locale }}" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{ vite src="resources/js/site.js|resources/css/site.css" }}

    <title>{{ title ?? site:name ?? 'Mrican Technologies Inc. | ERP Solutions'}} </title>

    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800,900&display=swap" rel="stylesheet" />

        <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        xintegrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body class="bg-white font-sans text-gray-800 antialiased">
    {{ partial:header }}
    {{ template_content }}
    {{ partial:footer }}

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const header = document.getElementById('main-header');
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');

            // --- 1. Sticky Header & Mobile Menu Toggle ---
            window.addEventListener('scroll', function () {
                if (window.scrollY > 50) {
                    header.classList.add('shadow-md');
                } else {
                    header.classList.remove('shadow-md');
                }
            });

            mobileMenuButton.addEventListener('click', function () {
                mobileMenu.classList.toggle('hidden');
            });

            // --- 2. Fade-in Animation on Scroll ---
            const animatedElements = document.querySelectorAll('.fade-in-up');
            const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);
            animatedElements.forEach(el => { observer.observe(el); });

            // --- 3. Active Nav Link on Scroll ---
            const navLinks = document.querySelectorAll('#main-nav a');
            const sections = document.querySelectorAll('section, footer');
            const headerHeight = 104; // 40px banner + 64px header

            window.addEventListener('scroll', () => {
                let current = '';
                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    if (pageYOffset >= (sectionTop - headerHeight - 1)) {
                        current = section.getAttribute('id');
                    }
                });

                navLinks.forEach(link => {
                    link.classList.remove('nav-link-active');
                    if (link.getAttribute('href').includes(current)) {
                        link.classList.add('nav-link-active');
                    }
                });
            });
        });
    </script>

</body>

</html>
