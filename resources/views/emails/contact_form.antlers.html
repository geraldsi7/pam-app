<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Contact Form Submission - {{ site_name }}</title>
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800,900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Figtree', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
            line-height: 1.6;
            color: #1e3a8a;
            background-color: #f8fafc;
            padding: 20px;
        }
        
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        
        .email-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: #60a5fa;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-icon-inner {
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 4px;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: white;
        }
        
        .header-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .header-subtitle {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 400;
        }
        
        .email-content {
            padding: 30px 20px;
        }
        
        .submission-info {
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .submission-info h3 {
            color: #1e3a8a;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .submission-info p {
            color: #64748b;
            font-size: 14px;
        }
        
        .field-group {
            margin-bottom: 20px;
        }
        
        .field {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #2563eb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        
        .field:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .field-label {
            font-weight: 600;
            color: #1e3a8a;
            margin-bottom: 6px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .field-value {
            color: #374151;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .message-field {
            background-color: #fefefe;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            white-space: pre-wrap;
            min-height: 80px;
        }
        
        .email-footer {
            background-color: #111827;
            color: #d1d5db;
            padding: 24px 20px;
            text-align: center;
        }
        
        .footer-content {
            font-size: 14px;
            line-height: 1.5;
        }
        
        .footer-content p {
            margin-bottom: 8px;
        }
        
        .footer-content a {
            color: #60a5fa;
            text-decoration: none;
        }
        
        .footer-content a:hover {
            color: #93c5fd;
        }
        
        .timestamp {
            background-color: #1f2937;
            color: #9ca3af;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 16px;
            display: inline-block;
        }
        
        /* Mobile responsiveness */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .email-container {
                border-radius: 8px;
            }
            
            .email-header {
                padding: 24px 16px;
            }
            
            .header-title {
                font-size: 24px;
            }
            
            .email-content {
                padding: 24px 16px;
            }
            
            .field {
                padding: 12px;
            }
            
            .email-footer {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="email-header">
            <h1 class="header-title">New Contact Form Submission</h1>
        </div>

        <!-- Content -->
        <div class="email-content">

            <div class="field-group">
                <div class="field">
                    <div class="field-label">First Name</div>
                    <div class="field-value">{{ first_name }}</div>
                </div>

                <div class="field">
                    <div class="field-label">Last Name</div>
                    <div class="field-value">{{ last_name }}</div>
                </div>

                <div class="field">
                    <div class="field-label">Email Address</div>
                    <div class="field-value">
                        <a href="mailto:{{ email }}" style="color: #2563eb; text-decoration: none;">{{ email }}</a>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">Message</div>
                    <div class="field-value message-field">{{ message_content }}</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="email-footer">
            <div class="footer-content">
                <div class="timestamp">
                    Submitted on: {{ date format="F j, Y \a\t g:i A" }}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
