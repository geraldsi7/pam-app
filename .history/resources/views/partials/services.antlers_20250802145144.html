<!-- Services Section -->
{{ collection:services limit="1" }}
<section id="services" class="py-20 bg-gray-50">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl md:text-4xl font-black text-center mb-12 fade-in-up">{{ heading }}</h2>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            {{ services }}
            <div class="service-card {{ featured ? 'lg:col-span-2' : '' }} bg-white p-8 rounded-xl shadow-md border border-gray-200 hover:shadow-xl hover:-translate-y-2 transition-all duration-300 fade-in-up"
                style="transition-delay: {{ index * 100 }}ms;">
                <i class="{{ icon }} text-4xl text-blue-800 mb-5"></i>
                <h3 class="text-2xl font-bold mb-4">{{ title }}</h3>
                <p class="text-gray-600">{{ description }}</p>
            </div>
            {{ /services }}
        </div>
    </div>
</section>
{{ /collection:services }}
