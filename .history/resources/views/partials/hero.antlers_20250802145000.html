<!-- Hero Section -->
{{ collection:hero limit="1" }}
<section id="hero" class="bg-gray-50 pt-28 pb-20 text-center">
    <div class="container mx-auto px-4">
        <h1 class="text-4xl md:text-6xl font-black text-blue-800 max-w-4xl mx-auto mb-6 fade-in-up">{{ heading }}</h1>
        <p class="text-lg md:text-xl text-gray-600 max-w-3xl mx-auto mb-10 fade-in-up" style="transition-delay: 150ms;">
            {{ description }}</p>
        <div class="flex justify-center gap-4 flex-wrap fade-in-up" style="transition-delay: 300ms;">
            <a href="{{ primary_button_link }}"
                class="bg-green-600 text-white font-bold py-4 px-8 rounded-lg hover:bg-green-700 transition-transform duration-200 hover:-translate-y-1 shadow-lg">{{ primary_button_text }}</a>
            <a href="{{ secondary_button_link }}"
                class="bg-transparent text-blue-800 font-bold py-4 px-8 rounded-lg border-2 border-blue-800 hover:bg-blue-800 hover:text-white transition-all duration-300">{{ secondary_button_text }}</a>
        </div>
    </div>
</section>
{{ /collection:hero }}
